[package]
name = "fdo-uefi"
version = "0.1.0"
edition = "2021"
authors = ["Brad Goodman <bradley.goodman@dell.com>"]
description = "FDO TO1/TO2 client as a UEFI application"
license = "Apache-2.0"

[features]
default = ["uefi-http", "tcp4-http", "di", "fdo-installer"]
# Use EFI_HTTP_PROTOCOL (available in OVMF/QEMU, some server firmware)
uefi-http = []
# Use TCP4-based HTTP (works on most real hardware without HTTP DXE driver)
tcp4-http = []
# Device Initialization — FDO DI protocol (manufacturing/provisioning)
di = []
# FDO Installer Image — TO1/TO2 onboarding + BMO payload delivery.
# Requires p256/ecdsa: the device MUST verify the Ownership Voucher entry chain
# and the TO2.ProveOVHdr / to1d signatures, which is ECDSA P-256 work.
fdo-installer = ["dep:p256", "dep:ecdsa"]
# RV-based firmware delivery (pre-onboarding firmware update via COSE_Sign1)
rv-firmware = ["dep:p256", "dep:ecdsa"]

[dependencies]
log = "0.4"
uefi = { version = "0.38", features = ["logger", "panic_handler", "alloc", "global_allocator"] }
uefi-raw = "0.15"  # For HttpMethod::POST access (matches uefi 0.38)
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
ecdsa = { version = "0.16", default-features = false, features = ["verifying"], optional = true }

# Note: fdo-data-formats with serde has no_std issues in UEFI target.
# Using manual CBOR encoding for now until serde issues are resolved.
# fdo-data-formats = { path = "../fido-device-onboard-rs/data-formats", default-features = false, features = ["uefi"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
